<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نتيجة امتحانات الدور الأول 2026</title>
    <!-- Include PapaParse for efficient CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

        /* Background & Setup */
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Blobs for Glassmorphism Effect */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.7;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 300px;
            height: 300px;
            background: #4158D0;
            top: -50px;
            right: -50px;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #C850C0;
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 250px;
            height: 250px;
            background: #FFCC70;
            top: 40%;
            left: 20%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .container {
            width: 100%;
            max-width: 700px;
            margin-top: 4vh;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #0f172a;
            text-shadow: 0 2px 4px rgba(255,255,255,0.5);
        }

        p.subtitle {
            color: #475569;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Loading & Messages */
        #loading {
            color: #b45309;
            font-weight: 700;
            font-size: 16px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(253, 230, 138, 0.5);
            border: 1px solid rgba(253, 230, 138, 0.8);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        #search-section {
            display: none;
        }

        /* Mobile-First Input Group */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
        }

        /* Glass Inputs & Buttons */
        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            outline: none;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            color: white;
            background: rgba(59, 130, 246, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            input[type="text"] { width: 75%; }
            button { width: 25%; }
        }

        button:hover {
            background: rgba(37, 99, 235, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Results Container & Cards */
        #results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-card {
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: right;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.65);
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item strong {
            display: inline-block;
            width: 110px;
            color: #334155;
            font-weight: 800;
        }

        .result-item span {
            color: #0f172a;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            color: white !important;
            font-weight: 800 !important;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Status Colors - Solid for readability */
        .status-passed { background: linear-gradient(135deg, #10b981, #059669); }
        .status-second-round { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .status-failed { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .status-absent { background: linear-gradient(135deg, #64748b, #475569); }
        .status-default { background: linear-gradient(135deg, #3b82f6, #2563eb); }

        #msg-box {
            font-weight: 700;
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .msg-error {
            color: #991b1b;
            background: rgba(254, 226, 226, 0.7);
            border: 1px solid rgba(252, 165, 165, 0.8);
        }

        .msg-warning {
            color: #9a3412;
            background: rgba(255, 237, 213, 0.7);
            border: 1px solid rgba(253, 186, 116, 0.8);
        }

        /* Adjustments for very small screens */
        @media (max-width: 400px) {
            .result-item strong {
                width: 100%;
                margin-bottom: 4px;
                color: #64748b;
            }
            .container {
                padding: 20px 15px;
            }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <h1>نتيجة امتحانات الدور الأول 2026</h1>
        <p class="subtitle">ابحث برقم الجلوس أو بالاسم للحصول على النتيجة</p>

        <div id="loading">
            جاري تحميل قاعدة البيانات (أكثر من 900 ألف طالب)...<br>
            يرجى الانتظار بضع ثوانٍ.
        </div>

        <div id="search-section">
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="أدخل رقم الجلوس أو الاسم هنا..." onkeypress="handleEnter(event)">
                <button onclick="searchResult()">بحث</button>
            </div>
            <div id="msg-box"></div>
        </div>

        <div id="results-container"></div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTp5dd_Ey70u94GlS-YeoaZmj7mOrX6IE9EE9B0xEs4RfU_YU6OAjzggHWk0kaeuew8pBIsqoGr7Tm/pub?output=csv";
        
        const studentsMap = new Map();
        const studentsArray = [];
        let headers = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            step: function(row) {
                if (headers.length === 0) {
                    headers = Object.keys(row.data);
                }
                
                const data = row.data;
                const seatKey = headers.find(k => k.includes('seating') || k.includes('جلوس')) || headers[0];
                
                if (data[seatKey]) {
                    const seatNum = data[seatKey].toString().trim();
                    studentsMap.set(seatNum, data);
                    studentsArray.push(data);
                }
            },
            complete: function() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('search-section').style.display = 'block';
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = "حدث خطأ أثناء تحميل البيانات. يرجى تحديث الصفحة.";
                document.getElementById('loading').style.color = "#dc2626";
                console.error("CSV Fetch Error: ", err);
            }
        });

        function handleEnter(e) {
            if (e.key === 'Enter') {
                searchResult();
            }
        }

        function normalizeArabic(text) {
            if (!text) return '';
            return text.replace(/[أإآ]/g, 'ا')
                       .replace(/ة/g, 'ه')
                       .replace(/ى/g, 'ي')
                       .trim();
        }

        function searchResult() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results-container');
            const msgBox = document.getElementById('msg-box');
            
            resultsContainer.innerHTML = '';
            msgBox.style.display = 'none';

            if (!query) return;

            const nameKey = headers.find(k => k.includes('name') || k.includes('الاسم')) || headers[1];
            
            let matchedStudents = [];
            const isNumeric = /^\d+$/.test(query);

            if (isNumeric) {
                const student = studentsMap.get(query);
                if (student) matchedStudents.push(student);
            } else {
                const normalizedQuery = normalizeArabic(query);
                
                for (let i = 0; i < studentsArray.length; i++) {
                    const studentName = normalizeArabic(studentsArray[i][nameKey]);
                    if (studentName.includes(normalizedQuery)) {
                        matchedStudents.push(studentsArray[i]);
                        if (matchedStudents.length >= 50) {
                            msgBox.innerText = "تم العثور على أكثر من 50 نتيجة. يرجى كتابة الاسم بشكل أدق، نعرض أول 50 فقط.";
                            msgBox.className = 'msg-warning';
                            msgBox.style.display = 'block';
                            break;
                        }
                    }
                }
            }

            if (matchedStudents.length === 0) {
                msgBox.innerText = "عذراً، لم يتم العثور على أي نتائج مطابقة.";
                msgBox.className = 'msg-error';
                msgBox.style.display = 'block';
                return;
            }

            matchedStudents.forEach(student => {
                resultsContainer.appendChild(createResultCard(student));
            });
        }

        function createResultCard(student) {
            const nameKey = headers.find(k => k.includes('name') || k.includes('الاسم')) || headers[1];
            const scoreKey = headers.find(k => k.includes('degree') || k.includes('المجموع')) || headers[2];
            const statusKey = headers.find(k => k.includes('case') || k.includes('حالة')) || headers[3];
            const seatKey = headers.find(k => k.includes('seating') || k.includes('جلوس')) || headers[0];

            const statusText = student[statusKey] || 'غير معروف';
            
            let statusClass = 'status-default';
            if (statusText.includes('ناجح')) statusClass = 'status-passed';
            else if (statusText.includes('دور ثان')) statusClass = 'status-second-round';
            else if (statusText.includes('راسب')) statusClass = 'status-failed';
            else if (statusText.includes('غياب')) statusClass = 'status-absent';

            const card = document.createElement('div');
            card.className = 'result-card';
            
            card.innerHTML = `
                <div class="result-item">
                    <strong>الاسم:</strong> <span>${student[nameKey]}</span>
                </div>
                <div class="result-item">
                    <strong>رقم الجلوس:</strong> <span>${student[seatKey]}</span>
                </div>
                <div class="result-item">
                    <strong>المجموع الكلي:</strong> <span>${student[scoreKey]} / 320</span>
                </div>
                <div class="result-item">
                    <strong>حالة الطالب:</strong> <span class="status-badge ${statusClass}">${statusText}</span>
                </div>
            `;
            
            return card;
        }
    </script>
</body>
</html>
