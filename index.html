<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة امتحانات الدور الأول 2026</title>
    <!-- Include PapaParse for efficient CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            text-align: center;
            margin-top: 5vh;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        #loading {
            color: #e67e22;
            font-weight: 600;
            font-size: 16px;
            padding: 20px;
            border: 2px dashed #e67e22;
            border-radius: 8px;
            background: #fff3e0;
        }

        #search-section {
            display: none;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            width: 70%;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Results Container */
        #results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        /* Result Card Styles */
        .result-card {
            padding: 20px;
            border-radius: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            text-align: right;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item strong {
            display: inline-block;
            width: 120px;
            color: #34495e;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        /* Status Colors */
        .status-passed { background-color: #2ecc71; }
        .status-second-round { background-color: #f39c12; }
        .status-failed { background-color: #e74c3c; }
        .status-absent { background-color: #95a5a6; }
        .status-default { background-color: #34495e; }

        #msg-box {
            font-weight: 600;
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .msg-error {
            color: #e74c3c;
            background-color: #fadbd8;
        }

        .msg-warning {
            color: #d35400;
            background-color: #fdebd0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>نتيجة امتحانات الدور الأول 2026</h1>
        <p class="subtitle">ابحث برقم الجلوس أو بالاسم للحصول على النتيجة</p>

        <div id="loading">
            جاري تحميل قاعدة البيانات (أكثر من 900 ألف طالب)...<br>
            يرجى الانتظار بضع ثوانٍ.
        </div>

        <div id="search-section">
            <div class="input-group">
                <!-- Changed to type="text" to accept both names and numbers -->
                <input type="text" id="searchInput" placeholder="أدخل رقم الجلوس أو الاسم هنا..." onkeypress="handleEnter(event)">
                <button onclick="searchResult()">بحث</button>
            </div>
            <div id="msg-box"></div>
        </div>

        <div id="results-container"></div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTp5dd_Ey70u94GlS-YeoaZmj7mOrX6IE9EE9B0xEs4RfU_YU6OAjzggHWk0kaeuew8pBIsqoGr7Tm/pub?output=csv";
        
        const studentsMap = new Map(); // For O(1) seat number lookups
        const studentsArray = [];      // For iterating over names
        let headers = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            step: function(row) {
                if (headers.length === 0) {
                    headers = Object.keys(row.data);
                }
                
                const data = row.data;
                const seatKey = headers.find(k => k.includes('seating') || k.includes('جلوس')) || headers[0];
                
                if (data[seatKey]) {
                    const seatNum = data[seatKey].toString().trim();
                    studentsMap.set(seatNum, data);
                    studentsArray.push(data);
                }
            },
            complete: function() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('search-section').style.display = 'block';
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = "حدث خطأ أثناء تحميل البيانات. يرجى تحديث الصفحة.";
                document.getElementById('loading').style.color = "red";
                console.error("CSV Fetch Error: ", err);
            }
        });

        function handleEnter(e) {
            if (e.key === 'Enter') {
                searchResult();
            }
        }

        // Helper function to normalize Arabic text for better searching
        function normalizeArabic(text) {
            if (!text) return '';
            return text.replace(/[أإآ]/g, 'ا')
                       .replace(/ة/g, 'ه')
                       .replace(/ى/g, 'ي')
                       .trim();
        }

        function searchResult() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results-container');
            const msgBox = document.getElementById('msg-box');
            
            // Clear previous results
            resultsContainer.innerHTML = '';
            msgBox.style.display = 'none';

            if (!query) return;

            const nameKey = headers.find(k => k.includes('name') || k.includes('الاسم')) || headers[1];
            
            let matchedStudents = [];
            const isNumeric = /^\d+$/.test(query);

            if (isNumeric) {
                // If the user typed only numbers, assume it's a seat number lookup
                const student = studentsMap.get(query);
                if (student) matchedStudents.push(student);
            } else {
                // If the user typed text, perform a name search
                const normalizedQuery = normalizeArabic(query);
                
                for (let i = 0; i < studentsArray.length; i++) {
                    const studentName = normalizeArabic(studentsArray[i][nameKey]);
                    if (studentName.includes(normalizedQuery)) {
                        matchedStudents.push(studentsArray[i]);
                        // Stop at 50 results to prevent the browser from freezing
                        if (matchedStudents.length >= 50) {
                            msgBox.innerText = "تم العثور على أكثر من 50 نتيجة. يرجى كتابة الاسم بشكل أدق، نعرض أول 50 فقط.";
                            msgBox.className = 'msg-warning';
                            msgBox.style.display = 'block';
                            break;
                        }
                    }
                }
            }

            if (matchedStudents.length === 0) {
                msgBox.innerText = "عذراً، لم يتم العثور على أي نتائج مطابقة.";
                msgBox.className = 'msg-error';
                msgBox.style.display = 'block';
                return;
            }

            // Render all matched students
            matchedStudents.forEach(student => {
                resultsContainer.appendChild(createResultCard(student));
            });
        }

        function createResultCard(student) {
            const nameKey = headers.find(k => k.includes('name') || k.includes('الاسم')) || headers[1];
            const scoreKey = headers.find(k => k.includes('degree') || k.includes('المجموع')) || headers[2];
            const statusKey = headers.find(k => k.includes('case') || k.includes('حالة')) || headers[3];
            const seatKey = headers.find(k => k.includes('seating') || k.includes('جلوس')) || headers[0];

            const statusText = student[statusKey] || 'غير معروف';
            
            // Determine badge color class
            let statusClass = 'status-default';
            if (statusText.includes('ناجح')) statusClass = 'status-passed';
            else if (statusText.includes('دور ثان')) statusClass = 'status-second-round';
            else if (statusText.includes('راسب')) statusClass = 'status-failed';
            else if (statusText.includes('غياب')) statusClass = 'status-absent';

            // Create HTML structure for the card
            const card = document.createElement('div');
            card.className = 'result-card';
            
            card.innerHTML = `
                <div class="result-item">
                    <strong>الاسم:</strong> <span>${student[nameKey]}</span>
                </div>
                <div class="result-item">
                    <strong>رقم الجلوس:</strong> <span>${student[seatKey]}</span>
                </div>
                <div class="result-item">
                    <strong>المجموع الكلي:</strong> <span>${student[scoreKey]} / 320</span>
                </div>
                <div class="result-item">
                    <strong>حالة الطالب:</strong> <span class="status-badge ${statusClass}">${statusText}</span>
                </div>
            `;
            
            return card;
        }
    </script>
</body>
</html>
